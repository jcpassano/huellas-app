<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Huellas</title>
<meta name="description" content="Huellas — mascotas perdidas, avistamientos y comunidad de búsqueda.">
<meta name="theme-color" content="#F5F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huellas">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{
    --ink:#17233E; --ink-soft:#5B6480; --ink-faint:#8C93AB;
    --paper:#F5F1E7; --surface:#FFFFFF; --surface-2:#FBF9F3; --line:#E4DCC8;
    --accent:#D98B2B; --accent-ink:#6B4300; --accent-soft:#FBE7C8;
    --alert:#C9432E; --alert-soft:#F8DED8; --alert-ink:#7A2113;
    --safe:#2F7A57; --safe-soft:#DCEEE2; --safe-ink:#184A32;
    --radius:18px; --radius-sm:11px;
    --shadow:0 1px 2px rgba(23,35,62,.05), 0 10px 28px -8px rgba(23,35,62,.18);
    --font-display:'Fraunces',ui-serif,Georgia,serif;
    --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1ECDD; --ink-soft:#B9B4A4; --ink-faint:#7E7968;
      --paper:#14151B; --surface:#1E2029; --surface-2:#252734; --line:#33333F;
      --accent:#EFA94C; --accent-ink:#FFDFA6; --accent-soft:#4A3416;
      --alert:#FF7B65; --alert-soft:#4A2320; --alert-ink:#FFC3B7;
      --safe:#5FCB93; --safe-soft:#1C3B2C; --safe-ink:#AEEBC7;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1ECDD; --ink-soft:#B9B4A4; --ink-faint:#7E7968;
    --paper:#14151B; --surface:#1E2029; --surface-2:#252734; --line:#33333F;
    --accent:#EFA94C; --accent-ink:#FFDFA6; --accent-soft:#4A3416;
    --alert:#FF7B65; --alert-soft:#4A2320; --alert-ink:#FFC3B7;
    --safe:#5FCB93; --safe-soft:#1C3B2C; --safe-ink:#AEEBC7;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -8px rgba(0,0,0,.5);
  }
  @font-face{font-family:'Fraunces';src:local('Fraunces');}
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  #app-root{max-width:560px; margin:0 auto; padding:0 16px; padding-block:0; min-height:100%; display:flex; flex-direction:column;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:15px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  #app a, .sheet a{color:var(--accent-ink); font-weight:600; text-decoration:none;}
  #app a:hover, .sheet a:hover{text-decoration:underline;}

  /* ---- topbar ---- */
  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 0 10px; background:linear-gradient(var(--paper) 78%, transparent);}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:30px; height:30px; color:var(--accent); flex:none;}
  .brand .word{font-family:var(--font-display); font-size:21px; font-weight:700; letter-spacing:-.01em;}
  .icon-btn{width:38px; height:38px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex:none; transition:transform .12s ease, border-color .12s ease;}
  .icon-btn:active{transform:scale(.93);}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn.on{color:var(--accent-ink); background:var(--accent-soft); border-color:transparent;}

  .demo-banner{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .demo-banner svg{width:16px; height:16px; flex:none; color:var(--accent);}

  /* ---- tabs ---- */
  .segmented{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .segmented::-webkit-scrollbar{display:none;}
  .segmented button{flex:none; min-width:0; border:none; background:transparent; padding:9px 12px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:5px; transition:background .15s ease, color .15s ease; white-space:nowrap;}
  .segmented button svg{width:14px; height:14px; flex:none;}
  .segmented button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---- directory chips ---- */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:8px 13px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap;}
  .chip svg{width:14px; height:14px;}
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* ---- community ---- */
  .tip-card{display:flex; gap:12px; align-items:flex-start; background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius); padding:14px; margin-bottom:18px; box-shadow:var(--shadow);}
  .tip-icon{flex:none; width:34px; height:34px; border-radius:999px; background:var(--surface); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .tip-icon svg{width:19px; height:19px;}
  .tip-body{flex:1; min-width:0;}
  .tip-label{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:3px;}
  .tip-text{font-size:13.5px; line-height:1.45; color:var(--ink);}
  .stat-row{display:flex; gap:10px; margin-bottom:20px;}
  .stat-tile{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .stat-num{font-family:var(--font-mono); font-size:26px; font-weight:500; color:var(--accent-ink); font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .section-title{font-size:15px; display:flex; align-items:center; gap:7px; margin-bottom:10px;}
  .section-title svg{width:16px; height:16px; color:var(--accent);}
  .rank-list{display:flex; flex-direction:column; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .rank-row{display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{flex:none; width:26px; height:26px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700;}
  .rank-pos.gold{background:#E8B54A; color:#3A2600;}
  .rank-pos.silver{background:#C7CDD6; color:#2B2F36;}
  .rank-pos.bronze{background:#CE8E5C; color:#3A2000;}
  .rank-name{flex:1; font-weight:600; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; flex-direction:column; gap:1px;}
  .rank-sub{font-size:11.5px; color:var(--ink-soft); font-weight:500;}
  .rank-prize{flex:none; font-size:11.5px; color:var(--accent-ink); font-weight:700; text-align:right; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---- prize table ---- */
  .prize-table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto;}
  .prize-table{width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap;}
  .prize-table th, .prize-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line);}
  .prize-table th{color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; background:var(--surface-2);}
  .prize-table td{white-space:normal;}
  .prize-table tbody tr:last-child td{border-bottom:none;}
  .prize-table td:first-child{color:var(--accent-ink); font-weight:700;}
  .standalone-hint{font-size:11.5px; color:var(--ink-faint); font-weight:400; line-height:1.5;}

  main{flex:1; padding-bottom:36px;}
  .screen-title{font-size:23px; margin-bottom:2px;}
  .screen-sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:16px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

  /* ---- pantalla de login / registro ---- */
  .auth-wrap{max-width:360px; margin:8vh auto 0; padding:8px 4px 40px;}
  .auth-logo{width:56px; height:56px; margin:0 auto 14px; border-radius:16px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .auth-logo svg{width:30px; height:30px;}
  .link-btn{background:none; border:none; padding:0; color:var(--accent-ink); font-weight:600; font-size:13.5px; text-decoration:underline; text-underline-offset:2px;}
  .back-link{display:inline-flex; align-items:center; gap:4px; background:none; border:none; padding:0; margin-bottom:14px; color:var(--ink-soft); font-weight:600; font-size:13.5px; font-family:var(--font-body);}
  .back-link svg{width:16px; height:16px; transform:rotate(90deg);}
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .menu-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow); font-family:var(--font-body);}
  .menu-card-hero{grid-column:1/-1; flex-direction:row; align-items:center; gap:14px; background:var(--accent-soft); border-color:var(--accent-soft);}
  .menu-card-hero .menu-icon{background:var(--surface); margin-bottom:0;}
  .menu-card-alert{grid-column:1/-1; flex-direction:row; align-items:center; gap:14px; background:var(--alert); border-color:var(--alert); box-shadow:0 6px 18px rgba(201,67,46,.32);}
  .menu-card-alert .menu-icon{background:rgba(255,255,255,.22); color:#fff; margin-bottom:0;}
  .menu-card-alert .menu-title{color:#fff; font-size:16.5px;}
  .menu-card-alert .menu-sub{color:rgba(255,255,255,.85);}
  .menu-icon{width:38px; height:38px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); flex:none; margin-bottom:2px;}
  .menu-icon svg{width:19px; height:19px;}
  .menu-card-hero .menu-icon svg{width:22px; height:22px;}
  .menu-card-alert .menu-icon svg{width:22px; height:22px;}
  .menu-title{font-weight:700; font-size:14.5px; color:var(--ink); line-height:1.25;}
  .menu-card-hero .menu-title{font-size:16px;}
  .menu-sub{font-size:12.5px; color:var(--ink-soft);}

  /* ---- cards ---- */
  .card-list{display:flex; flex-direction:column; gap:12px;}
  .pet-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; position:relative; overflow:hidden;}
  .pet-card.is-example::before{content:"EJEMPLO"; position:absolute; top:10px; right:-30px; transform:rotate(35deg); background:var(--accent); color:#2a1a00; font-size:10px; font-weight:700; letter-spacing:.06em; padding:3px 34px; box-shadow:var(--shadow);}
  .pet-top{display:flex; gap:12px;}
  .avatar{width:60px; height:60px; border-radius:14px; flex:none; background:var(--surface-2); border:1px solid var(--line); object-fit:cover; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--ink-faint); overflow:hidden;}
  .pet-info{flex:1; min-width:0;}
  .pet-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pet-name{font-family:var(--font-display); font-size:18px; font-weight:700;}
  .badge{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;}
  .badge svg{width:10px; height:10px; flex:none;}
  .badge-lost{background:var(--alert-soft); color:var(--alert-ink);}
  .badge-lost::before{content:""; width:6px; height:6px; border-radius:999px; background:var(--alert); animation:pulse 1.6s ease-in-out infinite;}
  .badge-safe{background:var(--safe-soft); color:var(--safe-ink);}
  .pet-breed{color:var(--ink-soft); font-size:13px; margin-top:1px;}
  .pet-meta{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:12.5px; color:var(--ink-soft);}
  .pet-meta span{display:inline-flex; align-items:center; gap:4px;}
  .pet-meta svg{width:13px; height:13px; flex:none;}
  .pet-desc{font-size:13.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}
  .card-actions{display:flex; gap:8px; margin-top:12px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* ---- buttons ---- */
  .btn{border-radius:999px; border:1px solid transparent; padding:10px 16px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:transform .1s ease, opacity .1s ease;}
  .btn svg{width:15px; height:15px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--alert); color:#fff;}
  .btn-primary.safe{background:var(--safe);}
  .btn-accent{background:var(--accent); color:#2a1a00;}
  .btn-secondary{background:var(--surface-2); color:var(--ink); border-color:var(--line);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; pointer-events:none;}
  .btn-sm{padding:7px 12px; font-size:12.5px;}

  /* ---- empty state ---- */
  .empty{border:1px dashed var(--line); border-radius:var(--radius); padding:22px 18px; text-align:center; color:var(--ink-soft); font-size:13.5px; margin-bottom:16px;}
  .empty svg{width:26px; height:26px; color:var(--accent); margin-bottom:8px;}

  /* ---- mine screen ---- */
  .mine-header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .status-switch{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px; font-size:12px; font-weight:700;}
  .status-switch button{border:none; background:transparent; padding:6px 11px; border-radius:999px; color:var(--ink-soft);}
  .status-switch button.on-safe{background:var(--safe); color:#fff;}
  .status-switch button.on-lost{background:var(--alert); color:#fff;}
  .owner-row{display:flex; justify-content:flex-end; gap:6px; margin-top:10px;}
  .sightings{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px;}
  .sightings-title{font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; gap:6px;}
  .sighting-item{background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 11px; font-size:12.5px;}
  .sighting-item .row1{display:flex; justify-content:space-between; gap:8px; color:var(--ink-soft); font-weight:600;}
  .sighting-item .note{margin-top:3px; color:var(--ink);}
  .sighting-item a{color:var(--accent-ink); font-weight:600;}

  .fab{position:fixed; right:calc(50% - 280px + 16px); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:54px; height:54px; border-radius:999px; background:var(--accent); color:#2a1a00; border:none; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; z-index:30;}
  @media (max-width:592px){ .fab{right:20px;} }
  .fab svg{width:24px; height:24px;}

  /* ---- sheets / modals ---- */
  .backdrop{position:fixed; inset:0; background:rgba(20,17,10,.42); z-index:40; display:flex; align-items:flex-end; justify-content:center; padding:0;}
  .sheet{background:var(--paper); width:100%; max-width:560px; border-radius:22px 22px 0 0; max-height:88vh; overflow-y:auto; padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 30px rgba(0,0,0,.25);}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .sheet-title{font-size:19px;}
  .sheet-pet{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field .hint{font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:4px;}
  .field input[type=text], .field input[type=tel], .field input[type=number], .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:11px; padding:10px 12px; font-size:14.5px;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .checkbox-row{display:flex; flex-wrap:wrap; gap:10px 16px; margin:4px 0 14px;}
  .checkbox-field{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:var(--ink);}
  .checkbox-field input{width:17px; height:17px; accent-color:var(--accent);}
  .field-row .field{flex:1;}
  .photo-pick{display:flex; align-items:center; gap:12px;}
  .photo-pick .avatar{width:54px; height:54px; cursor:pointer;}
  .photo-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .photo-tile{position:relative; width:64px; height:64px; border-radius:12px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); flex:none; padding:0;}
  .photo-tile img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-tile.add-tile{display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); color:var(--ink-faint); cursor:pointer;}
  .photo-tile.add-tile svg{width:22px; height:22px;}
  .remove-photo{position:absolute; top:3px; right:3px; width:19px; height:19px; border-radius:999px; background:rgba(20,20,20,.6); color:#fff; display:flex; align-items:center; justify-content:center; border:none; padding:0;}
  .remove-photo svg{width:11px; height:11px;}
  .photo-strip{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .photo-strip-item{width:44px; height:44px; border-radius:9px; overflow:hidden; border:1px solid var(--line); flex:none; display:block;}
  .photo-strip-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .loc-box{border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; background:var(--surface);}
  .loc-status{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600;}
  .loc-status svg{width:16px; height:16px; color:var(--accent);}
  .loc-coords{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .manual-toggle{margin-top:8px;}
  .sheet-footer{display:flex; gap:10px; margin-top:6px;}
  .sheet-footer .btn{flex:1;}

  /* ---- toast ---- */
  #toast-root{position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; z-index:60; pointer-events:none;}
  .toast{background:var(--ink); color:var(--paper); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px; box-shadow:var(--shadow); max-width:86%; text-align:center;}

  .spinner{width:16px; height:16px; border-radius:999px; border:2px solid rgba(0,0,0,.15); border-top-color:currentColor; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  [hidden]{display:none!important;}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<div id="app-root">
  <div class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <span class="word">Huellas</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" id="logout-btn" data-action="logout" title="Cerrar sesión" aria-label="Cerrar sesión" hidden></button>

  /* ============ HELPERS ============ */
  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
  function nowIso(){ return new Date().toISOString(); }
  function byFieldDesc(field){
    return function(a,b){
      var av = a && a[field] ? a[field] : '';
      var bv = b && b[field] ? b[field] : '';
      return av < bv ? 1 : (av > bv ? -1 : 0);
    };
  }

  function timeAgo(iso){
    if(!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff/60000);
    if(min < 1) return 'recién';
    if(min < 60) return 'hace ' + min + ' min';
    var hr = Math.floor(min/60);
    if(hr < 24) return 'hace ' + hr + ' h';
    var d = Math.floor(hr/24);
    if(d < 7) return 'hace ' + d + ' d';
    return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'short'});
  }

  function formatDuration(fromIso, toIso){
    if(!fromIso || !toIso) return null;
    var ms = new Date(toIso).getTime() - new Date(fromIso).getTime();
    if(ms < 0) ms = 0;
    var min = Math.round(ms/60000);
    if(min < 60) return min + ' min';
    var hr = Math.round(min/60);
    if(hr < 48) return hr + ' h';
    var d = Math.round(hr/24);
    return d + ' día' + (d===1?'':'s');
  }

  var SEARCH_RADIUS_KM = 30;
  function distanceKm(a,b){
    if(!a||!b||a.lat==null||b.lat==null) return null;
    var R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
    var s1=Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(Math.min(1,s1)));
  }
  function formatDistance(km){
    if(km==null) return null;
    if(km < 1) return Math.round(km*1000) + ' m';
    return (Math.round(km*10)/10) + ' km';
  }
  function mapsLink(lat,lng){ return 'https://www.google.com/maps?q=' + lat + ',' + lng; }
  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }

  function getLocation(){
    return new Promise(function(resolve,reject){
      if(!('geolocation' in navigator)) { reject(new Error('unsupported')); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}); },
        function(err){ reject(err); },
        {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
      );
    });
  }

  function showToast(msg){
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 320); }, 2600);
  }

  /* ============ BACKEND PROPIO (reemplaza window.claude.use) ============
     La app habla con /api/... en el mismo servidor que la sirve. Esta capa
     imita la formita de "colección/documento" que ya usa el resto del
     código (igual que antes), para no tener que tocar el resto del archivo. */
  var API_BASE = '';
  var TOKEN_KEY = 'huellas_token';
  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
  function setToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  /* ============ INSTALAR EN EL CELULAR (PWA) ============ */
  var INSTALL_DISMISS_KEY = 'huellas_install_dismissed';
  function isStandaloneMode(){
    try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
    catch(e){ return false; }
  }
  function isIOSDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
  function getInstallDismissed(){ try{ return localStorage.getItem(INSTALL_DISMISS_KEY) === '1'; }catch(e){ return false; } }
  function dismissInstallBanner(){ try{ localStorage.setItem(INSTALL_DISMISS_KEY, '1'); }catch(e){} }

  function apiFetch(path, opts){
    opts = opts || {};
    var headers = Object.assign({}, opts.headers||{});
    var token = getToken();
    if(token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(API_BASE + path, Object.assign({}, opts, {headers: headers})).then(function(res){
      if(res.status === 401){
        setToken(null);
        state.currentUser = null; state.db = null; state.user = null; state.assets = null;
        state.authView = 'login';
        state.authError = 'Tu sesión venció. Iniciá sesión de nuevo.';
        render();
      }
      return res.json()['catch'](function(){ return {}; }).then(function(body){
        if(!res.ok){ var err = new Error((body && body.error) || 'No se pudo completar la acción.'); throw err; }
        return body;
      });
    });
  }

  function makeDbClient(){
    function collectionRef(name){
      var filters = [];
      var limitN = 200;
      var ref = {
        where: function(field, op, val){ filters.push([field, op, val]); return ref; },
        limit: function(n){ limitN = n; return ref; },
        doc: function(id){ return docRef(name, id); },
        onSnapshot: function(cb, errCb){
          var stopped = false, knownIds = null;
          function toDocShape(d){ var data = Object.assign({}, d); delete data.id; return { id: d.id, data: function(){ return data; } }; }
          function poll(){
            if(stopped) return;
            var qs = '?filters=' + encodeURIComponent(JSON.stringify(filters)) + '&limit=' + limitN;
            apiFetch('/api/collections/' + name + qs).then(function(body){
              var docs = body.docs || [];
              var idSet = {}, added = [];
              docs.forEach(function(d){ idSet[d.id] = true; if(knownIds && !knownIds[d.id]) added.push(d); });
              knownIds = idSet;
              cb({
                docs: docs.map(toDocShape),
                docChanges: function(){ return added.map(function(d){ return {type:'added', doc: toDocShape(d)}; }); }
              });
            })['catch'](function(err){ if(errCb) errCb(err); });
          }
          poll();
          var interval = setInterval(poll, 15000);
          return function(){ stopped = true; clearInterval(interval); };
        }
      };
      return ref;
    }
    function docRef(name, id){
      var path = '/api/collections/' + name + '/' + encodeURIComponent(id);
      return {
        set: function(body){ return apiFetch(path, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); },
        update: function(body){ return apiFetch(path, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); },
        'delete': function(){ return apiFetch(path, {method:'DELETE'}); }
      };
    }
    return { collection: collectionRef };
  }

  function makeUserClient(){
    return {
      id: function(){ return Promise.resolve(state.currentUser ? state.currentUser.id : null); },
      profiles: function(ids){
        if(!ids || !ids.length) return Promise.resolve({});
        return apiFetch('/api/auth/users?ids=' + encodeURIComponent(ids.join(',')));
      }
    };
  }

  function makeAssetsClient(){
    return {
      upload: function(file){
        var fd = new FormData();
        fd.append('file', file);
        var headers = {};
        var token = getToken();
        if(token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(API_BASE + '/api/uploads', {method:'POST', headers: headers, body: fd}).then(function(res){
          return res.json().then(function(body){
            if(!res.ok) throw new Error(body.error || 'No se pudo subir la foto.');
            return body;
          });
        });
      }
    };
  }

  function afterLogin(user, token){
    setToken(token);
    state.currentUser = user;
    state.myId = user.id;
    state.db = makeDbClient();
    state.user = makeUserClient();
    state.assets = makeAssetsClient();
    state.authError = '';
    render();
    initData();
  }

  function logout(){
    setToken(null);
    state.currentUser = null; state.myId = null;
    state.db = null; state.user = null; state.assets = null;
    state.authView = 'login'; state.authError = '';
    render();
  }

  function tryResumeSession(){
    var token = getToken();
    if(!token){ state.authView = 'login'; render(); return; }
    apiFetch('/api/auth/me').then(function(body){
      afterLogin(body.user, token);
    })['catch'](function(){
      setToken(null);
      state.authView = 'login';
      render();
    });
  }

  function renderAuthScreen(){
    var isRegister = state.authView === 'register';
    var html = '';
    html += '<div class="auth-wrap">';
    html += '<div class="auth-logo">' + icon('paw') + '</div>';
    html += '<h2 class="screen-title" style="text-align:center;">' + (isRegister ? 'Creá tu cuenta' : 'Iniciá sesión') + '</h2>';
    html += '<div class="screen-sub" style="justify-content:center;">Huellas: mascotas perdidas y comunidad de búsqueda.</div>';
    if(state.authError){ html += '<div class="hint" style="color:var(--alert); font-weight:600; margin-bottom:10px; text-align:center;">' + esc(state.authError) + '</div>'; }
    html += '<form id="auth-form" novalidate>';
    if(isRegister){
      html += '<div class="field"><label for="au-name">Tu nombre</label><input type="text" id="au-name" placeholder="Como querés que te vean en Huellas"></div>';
    }
    html += '<div class="field"><label for="au-email">Email</label><input type="email" id="au-email" placeholder="vos@email.com" autocomplete="username"></div>';
    html += '<div class="field"><label for="au-password">Contraseña</label><input type="password" id="au-password" placeholder="Al menos 6 caracteres" autocomplete="' + (isRegister?'new-password':'current-password') + '"></div>';
    html += '<button type="submit" class="btn btn-accent btn-block" id="auth-submit-btn">' + (isRegister ? icon('check')+'Crear cuenta' : icon('check')+'Entrar') + '</button>';
    html += '</form>';
    html += '<button type="button" class="link-btn" style="margin-top:16px; display:block; width:100%; text-align:center;" data-action="auth-switch">' +
      (isRegister ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Creá una') +
    '</button>';
    html += '</div>';
    return html;
  }

    missing.forEach(function(id){ profileFetching[id] = true; });

  function resubscribeSightings(){
    var lostIds = state.myPets.filter(function(p){ return p.status==='perdida'; }).map(function(p){ return p.id; }).slice(0,30);
    var key = lostIds.slice().sort().join(',');
    if(key === lastSightingKey) return;
    lastSightingKey = key;
    if(unsubSightings){ unsubSightings(); unsubSightings=null; }
    state.sightingsByPet = {};
    if(!state.db || lostIds.length===0){ render(); return; }
    sightingsInitialLoad = true;
    unsubSightings = state.db.collection('sightings').where('petId','in',lostIds).limit(150).onSnapshot(function(snap){
      var wasInitial = sightingsInitialLoad;
      if(!wasInitial){
        snap.docChanges().forEach(function(ch){
          if(ch.type==='added'){
            var s = ch.doc.data(); s.id = ch.doc.id;
            var pet = state.myPets.filter(function(p){ return p.id===s.petId; })[0];
            notifyNewSighting(pet, s);
          }
        });
      }
      sightingsInitialLoad = false;
      var map = {};
      snap.docs.forEach(function(d){
        var s = d.data(); s.id = d.id;
        (map[s.petId] = map[s.petId] || []).push(s);
      });
      Object.keys(map).forEach(function(k){ map[k].sort(byFieldDesc('createdAt')); });
      state.sightingsByPet = map;
      render();
    }, function(err){ console.warn('sightings error', err); });
  }

      }catch(e){}
    }
  }

  /* ============ WRITES ============ */
  /* Optimistic local-state helpers: update what THIS viewer sees immediately,
     instead of waiting on the realtime subscription round-trip. The
     subscription still applies as the source of truth when it delivers. */
  function upsertMyPet(pet){
    var i = state.myPets.findIndex(function(p){ return p.id===pet.id; });
    if(i>=0) state.myPets[i] = pet; else state.myPets.unshift(pet);
    state.myPets.sort(byFieldDesc('createdAt'));
    state.myPetsLoaded = true;
  }
  function removeMyPet(id){
    state.myPets = state.myPets.filter(function(p){ return p.id!==id; });
    delete state.sightingsByPet[id];
  }
  function upsertLostPet(pet){
    if(pet.status !== 'perdida'){ state.petsLost = state.petsLost.filter(function(p){ return p.id!==pet.id; }); return; }
    var i = state.petsLost.findIndex(function(p){ return p.id===pet.id; });
    if(i>=0) state.petsLost[i] = pet; else state.petsLost.unshift(pet);
    state.petsLost.sort(byFieldDesc('updatedAt'));
    state.petsLostLoaded = true;
  }

  function resolvePhotos(existingPhotos, newFiles){
    var kept = (existingPhotos||[]).slice(0, MAX_PET_PHOTOS).map(function(p){ return {photoAssetId:p.assetId||null, photoUrl:p.url}; });
    var files = (newFiles||[]).slice(0, Math.max(0, MAX_PET_PHOTOS - kept.length));
    var uploadPromises = (state.assets ? files : []).map(function(file){
      return state.assets.upload(file).then(function(res){
        return {photoAssetId: res.id, photoUrl: res.url};
      })['catch'](function(){ return null; });
    });
    return Promise.all(uploadPromises).then(function(uploaded){
      var failedCount = uploaded.filter(function(u){ return !u; }).length;
      if(failedCount>0) showToast(failedCount===1 ? 'No se pudo subir una de las fotos.' : 'No se pudieron subir ' + failedCount + ' de las fotos.');
      var allPhotos = kept.concat(uploaded.filter(Boolean)).slice(0, MAX_PET_PHOTOS);
      return {
        photoAssetIds: allPhotos.map(function(p){ return p.photoAssetId; }),
        photoUrls: allPhotos.map(function(p){ return p.photoUrl; }),
        photoAssetId: allPhotos.length ? allPhotos[0].photoAssetId : null,
        photoUrl: allPhotos.length ? allPhotos[0].photoUrl : null
      };
    });
  }

  function savePet(form, existing){
    if(!state.db){ showToast('Modo de ejemplo: esta acción se guardaría en la app real.'); closeSheet(); return Promise.resolve(); }
    var id = existing ? existing.id : uid('p');
    var ref = state.db.collection('pets').doc(id);
    return resolvePhotos(form.existingPhotos, form.newPhotoFiles).then(function(photos){
      var body = Object.assign({
        ownerId: state.myId,
        name: form.name, species: form.species, breed: form.breed||'', color: form.color||'', size: form.size||'',
        description: form.description||'',
        contactName: form.contactName||'', contactPhone: form.contactPhone||'', contactNote: form.contactNote||'',
        status: existing ? existing.status : (form.lostIntent ? 'perdida' : 'segura'),
        lastSeen: existing ? (existing.lastSeen||null) : ((form.lostIntent && form.loc) ? {lat:form.loc.lat, lng:form.loc.lng, timestamp: nowIso()} : null),
        createdAt: existing ? existing.createdAt : nowIso(),
        updatedAt: nowIso()
      }, photos);
      var writeOp = existing ? ref.update(body) : ref.set(body);
      return writeOp.then(function(){ return body; });
    }).then(function(body){
      var fullPet = Object.assign({}, body, {id:id});
      upsertMyPet(fullPet);
      upsertLostPet(fullPet);
      render();
      showToast(existing ? 'Ficha actualizada.' : (form.lostIntent ? (form.name + ' fue publicada como perdida. La comunidad ya puede verla.') : 'Ficha creada. Ya la ves en "Mis mascotas".'));
      closeSheet();
    })['catch'](function(err){
      console.warn('Huellas: no se pudo guardar la ficha', err);
      showToast('No se pudo guardar. Probá de nuevo.');
    });
  }

  function setPetStatus(pet, status, loc){
    if(!state.db) { showToast('Modo de ejemplo: esta acción se guardaría en la app real.'); return; }
    var wasLost = pet.status === 'perdida';
    var body = {status:status, updatedAt: nowIso()};
    if(status === 'perdida'){ body.lastSeen = {lat:loc.lat, lng:loc.lng, timestamp: nowIso()}; }
    state.db.collection('pets').doc(pet.id).update(body).then(function(){
      var updated = Object.assign({}, pet, body);
      upsertMyPet(updated);
      upsertLostPet(updated);
      resubscribeSightings();
      if(status === 'segura' && wasLost){
        logFound(updated);
      }
      render();
      showToast(status==='perdida' ? (pet.name + ' fue marcada como perdida y ya es visible para la comunidad.') : ('¡Qué alivio! ' + pet.name + ' está segura.'));
    })['catch'](function(err){ console.warn('Huellas: no se pudo actualizar el estado', err); showToast('No se pudo actualizar el estado.'); });
  }

  function upsertBusiness(business){
    var i = state.businesses.findIndex(function(b){ return b.id===business.id; });
    if(i>=0) state.businesses[i] = business; else state.businesses.unshift(business);
    state.businesses.sort(byFieldDesc('updatedAt'));
    state.businessesLoaded = true;
  }
  function removeBusiness(id){
    state.businesses = state.businesses.filter(function(b){ return b.id!==id; });
  }
  function findBusiness(id){
    return state.businesses.filter(function(b){return b.id===id;})[0]
      || EXAMPLE_BUSINESSES.filter(function(b){return b.id===id;})[0]
      || null;
  }

  function saveBusiness(form, existing){
    if(!state.db){ showToast('Modo de ejemplo: esta acción se guardaría en la app real.'); closeSheet(); return Promise.resolve(); }
    var id = existing ? existing.id : uid('biz');
    var uploadStep = Promise.resolve({photoAssetId: existing ? existing.photoAssetId||null : null, photoUrl: existing ? existing.photoUrl||null : null});
    if(form.photoFile && state.assets){
      uploadStep = state.assets.upload(form.photoFile).then(function(res){
        return {photoAssetId: res.id, photoUrl: res.url};
      })['catch'](function(){ showToast('No se pudo subir la foto; se guardó el establecimiento sin foto.'); return {photoAssetId:null, photoUrl:null}; });
    }
    return uploadStep.then(function(photo){
      var body = {
        ownerId: state.myId,
        category: form.category, name: form.name, responsibleName: form.responsibleName,
        email: form.email, phone: form.phone||'', description: form.description||'',
        photoAssetId: photo.photoAssetId, photoUrl: photo.photoUrl,
        createdAt: existing ? existing.createdAt : nowIso(),
        updatedAt: nowIso()
      };
      var ref = state.db.collection('businesses').doc(id);
      var writeOp = existing ? ref.update(body) : ref.set(body);
      return writeOp.then(function(){
        upsertBusiness(Object.assign({}, body, {id:id}));
        render();
        showToast(existing ? 'Establecimiento actualizado.' : 'Establecimiento registrado en el directorio.');
        closeSheet();
      });
    })['catch'](function(err){ console.warn('Huellas: no se pudo guardar el establecimiento', err); showToast('No se pudo guardar. Probá de nuevo.'); });
  }

  function deleteBusiness(business){
    if(!state.db){ showToast('Modo de ejemplo.'); closeSheet(); return; }
    state.db.collection('businesses').doc(business.id).delete().then(function(){
      removeBusiness(business.id);
      render();
      showToast('Establecimiento eliminado.');
      closeSheet();
    })['catch'](function(err){ console.warn('Huellas: no se pudo eliminar el establecimiento', err); showToast('No se pudo eliminar.'); });
  }

    var i = state.adoptions.findIndex(function(a){ return a.id===adoption.id; });
    if(i>=0) state.adoptions[i] = adoption; else state.adoptions.unshift(adoption);
    state.adoptions.sort(byFieldDesc('updatedAt'));

    state.adoptions = state.adoptions.filter(function(a){ return a.id!==id; });

  function findAdoption(id){

  function saveAdoption(form, existing){
    if(!state.db){ showToast('Modo de ejemplo: esta acción se guardaría en la app real.'); closeSheet(); return Promise.resolve(); }
    var id = existing ? existing.id : uid('ad');
    var ref = state.db.collection('adoptions').doc(id);
    return resolvePhotos(form.existingPhotos, form.newPhotoFiles).then(function(photos){

  function defaultDonationMethod(){
    var cfg = state.db ? state.donationConfig : EXAMPLE_DONATION_CONFIG;
    if(cfg && cfg.mpAlias) return 'mp';
    if(cfg && cfg.paypalAlias) return 'paypal';
    return 'mp';

  /* Los alias son fijos: los carga una sola persona (quien los guarda primero
     queda como administrador/a) y de ahí en más solo esa cuenta puede editarlos. */
  function canEditDonation(cfg){
    if(!state.db) return true; /* modo de ejemplo: no se guarda nada realmente */
    if(!cfg || !cfg.adminId) return true; /* nadie los cargó todavía: la próxima persona que guarde queda como admin */
    return !!(state.myId && cfg.adminId === state.myId);
  }

  function saveDonationConfig(form){
    if(!state.db){
      showToast('Modo de ejemplo: esta acción se guardaría en la app real.');
      if(state.sheet) state.sheet.settingsMode = false;
      render();
      return;
    }
    if(!canEditDonation(state.donationConfig)){
      showToast('Solo la persona administradora de Huellas puede editar estos alias.');
      return;
    }
    var body = {
      mpAlias: form.mpAlias||'',
      paypalAlias: form.paypalAlias||'',
      adminId: state.donationConfig.adminId || state.myId || null,
      updatedAt: nowIso()
    };
    state.db.collection('settings').doc('donation').set(body).then(function(){
      var wasClaim = !state.donationConfig.adminId && body.adminId;
      state.donationConfig = body;
      state.donationConfigLoaded = true;
      if(state.sheet && state.sheet.type==='donate'){
        state.sheet.settingsMode = false;
        if(state.sheet.method==='mp' && !body.mpAlias && body.paypalAlias) state.sheet.method = 'paypal';
        if(state.sheet.method==='paypal' && !body.paypalAlias && body.mpAlias) state.sheet.method = 'mp';
      }
      render();
      showToast(wasClaim ? 'Alias guardados. Quedaste como administrador/a: de ahora en más, solo vos podés editarlos.' : 'Alias actualizados.');
    })['catch'](function(err){ console.warn('Huellas: no se pudo guardar el alias', err); showToast('No se pudo guardar. Probá de nuevo.'); });
  }

  function renderHome(){

      nearbyMode = true;
      list = list
        .map(function(pet){ return {pet:pet, d: pet.lastSeen ? distanceKm(state.myLocation, pet.lastSeen) : null}; })
        .filter(function(row){ return row.d!=null && row.d <= SEARCH_RADIUS_KM; })

    return 'https://www.google.com/maps/search/?api=1&query=' + q;

  /* ============ RENDER: COMMUNITY ============ */
  function computeRanking(){
    var byReporter = {}; // id -> {sightings:n, pets:Set}
    state.allSightings.forEach(function(s){
      var key = s.reporterId || 'anon';
      if(!byReporter[key]) byReporter[key] = {id: s.reporterId||null, sightings:0, petIds:{}};
      byReporter[key].sightings++;
      if(s.petId) byReporter[key].petIds[s.petId] = true;
    });
    var rows = Object.keys(byReporter).map(function(key){
      var r = byReporter[key];
      var points = r.sightings * POINTS_PER_SIGHTING;
      return {id:r.id, sightings:r.sightings, petsHelped: Object.keys(r.petIds).length, points:points, prize: prizeForPoints(points)};
    });
    rows.sort(function(a,b){ return b.points - a.points; });
    return rows.slice(0,10);
  }

    function bindMultiPhotoInput(inputId){
      var input = document.getElementById(inputId);
      if(!input) return;
      input.addEventListener('change', function(e){
        var files = e.target.files ? Array.prototype.slice.call(e.target.files) : [];
        if(!files.length || !state.sheet) return;
        var remaining = MAX_PET_PHOTOS - ((state.sheet.existingPhotos||[]).length + (state.sheet.newPhotos||[]).length);
        if(remaining <= 0){ showToast('Ya llegaste al máximo de ' + MAX_PET_PHOTOS + ' fotos.'); e.target.value=''; return; }
        files = files.slice(0, remaining);
        var pending = files.length;
        files.forEach(function(file){
          var reader = new FileReader();
          reader.onload = function(ev){
            state.sheet.newPhotos = state.sheet.newPhotos || [];
            state.sheet.newPhotos.push({file:file, previewUrl:ev.target.result});
            pending--;
            if(pending===0) updatePhotoGrid();
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      });
    }
    bindMultiPhotoInput('pet-photo-input');
    bindMultiPhotoInput('adopt-photo-input');
    var bizPhotoInput = document.getElementById('biz-photo-input');
    if(bizPhotoInput){
      bizPhotoInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        state.sheet.pendingPhotoFile = file;
        var reader = new FileReader();
        reader.onload = function(ev){
          var prev = document.getElementById('photo-preview');
          if(prev) prev.innerHTML = '<img src="'+ev.target.result+'" alt="">';
        };
        reader.readAsDataURL(file);
      });
    }
  }

  var MAX_PET_PHOTOS = 5;
  function renderPhotoGridInner(sheet, inputId){
    inputId = inputId || 'pet-photo-input';
    var tiles = '';
    (sheet.existingPhotos||[]).forEach(function(p, i){
      tiles += '<div class="photo-tile"><img src="'+esc(p.url)+'" alt=""><button type="button" class="remove-photo" data-action="remove-existing-photo" data-index="'+i+'" aria-label="Quitar foto">'+icon('x')+'</button></div>';
    });
    (sheet.newPhotos||[]).forEach(function(p, i){
      tiles += '<div class="photo-tile"><img src="'+esc(p.previewUrl)+'" alt=""><button type="button" class="remove-photo" data-action="remove-new-photo" data-index="'+i+'" aria-label="Quitar foto">'+icon('x')+'</button></div>';
    });
    var total = (sheet.existingPhotos||[]).length + (sheet.newPhotos||[]).length;
    if(total < MAX_PET_PHOTOS){
      tiles += '<button type="button" class="photo-tile add-tile" data-action="pick-photo" data-photo-target="'+inputId+'" aria-label="Agregar foto">'+icon('camera')+'</button>';
    }
    return tiles;
  }

  function extraPhotosStrip(pet){

    return '<div class="photo-strip">' + pet.photoUrls.slice(1, MAX_PET_PHOTOS).map(function(url){

      html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" data-action="get-location" data-target="'+esc(s.type)+'">Volver a ubicar</button>';

  /* ============ EVENTS ============ */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action], [data-tab]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    var tab = t.getAttribute('data-tab');

    if(tab){ state.tab = tab; if(tab==='home'){ state.homeView = null; } render(); return; }

    if(action === 'auth-switch'){ state.authView = (state.authView==='register') ? 'login' : 'register'; state.authError=''; render(); return; }
    if(action === 'logout'){ logout(); return; }

    if(action === 'go-lost-list'){ state.homeView = 'lost'; render(); return; }
    if(action === 'go-home-menu'){ state.homeView = null; render(); return; }
    if(action === 'add-pet-shortcut'){ state.tab = 'mine'; state.sheet = {type:'pet', pet:null, existingPhotos:[], newPhotos:[]}; render(); return; }
    if(action === 'report-lost-shortcut'){ state.tab = 'mine'; state.sheet = {type:'pet', pet:null, existingPhotos:[], newPhotos:[], lostIntent:true, loc:null, manual:false}; render(); return; }
    if(action === 'go-adoptions'){ state.tab = 'directory'; state.contactFilter = 'adopciones'; render(); return; }
    if(action === 'go-directory'){ state.tab = 'directory'; state.contactFilter = 'all'; render(); return; }
    if(action === 'go-community'){ state.tab = 'community'; render(); return; }
    if(action === 'go-mine'){ state.tab = 'mine'; render(); return; }
    if(action === 'install-app'){
      var evt = state.installPromptEvent;
      if(!evt) return;
      state.installPromptEvent = null;
      render();
      evt.prompt();
      evt.userChoice['catch'](function(){})['then'](function(){ /* no-op: el navegador maneja el resultado */ });
      return;
    }
    if(action === 'dismiss-install-banner'){ state.installDismissed = true; dismissInstallBanner(); render(); return; }

    if(action === 'use-location'){
      t.disabled = true; t.textContent = 'Activando…';
      getLocation().then(function(loc){ state.myLocation = loc; render(); })['catch'](function(){
        showToast('No pudimos acceder a tu ubicación. Podés activarla desde los permisos del navegador.');
        render();
      });
      return;
    }
    if(action === 'use-location-for-search'){
      t.disabled = true; t.innerHTML = '<span class="spinner"></span> Activando…';
      getLocation().then(function(loc){ state.myLocation = loc; render(); })['catch'](function(){
        showToast('No pudimos acceder a tu ubicación. Igual podés buscar sin ella desde Google Maps.');
        render();
      });
      return;
    }
    if(action === 'info-open'){ state.sheet = {type:'info'}; render(); return; }
    if(action === 'close-sheet'){ closeSheet(); return; }
    if(action === 'toggle-notif'){
      if(!('Notification' in window)){ showToast('Tu navegador no soporta notificaciones.'); return; }
      if(state.notifPermission === 'granted'){ showToast('Los avisos ya están activados en este navegador.'); return; }
      Notification.requestPermission().then(function(perm){
        state.notifPermission = perm; render();
        if(perm==='granted') showToast('Avisos activados en este navegador.');
        else if(perm==='denied') showToast('Quedaron bloqueados. Podés habilitarlos desde la configuración del sitio.');
      })['catch'](function(){ showToast('No se pudieron activar los avisos acá.'); });
      return;
    }
    if(action === 'open-report'){
      var pet = findPet(t.getAttribute('data-pet-id'));
      if(pet) { state.sheet = {type:'report', pet:pet, loc:null, manual:false}; render(); }
      return;
    }
    if(action === 'add-pet'){ state.sheet = {type:'pet', pet:null, existingPhotos:[], newPhotos:[]}; render(); return; }
    if(action === 'edit-pet'){
      var petE = findPet(t.getAttribute('data-pet-id'));
      if(petE) {
        var initPhotos = [];
        if(petE.photoUrls && petE.photoUrls.length){
          initPhotos = petE.photoUrls.map(function(url, i){ return {assetId: (petE.photoAssetIds||[])[i]||null, url:url}; });
        } else if(petE.photoUrl){
          initPhotos = [{assetId: petE.photoAssetId||null, url: petE.photoUrl}];
        }
        state.sheet = {type:'pet', pet:petE, existingPhotos:initPhotos, newPhotos:[]};
        render();
      }
      return;
    }
    if(action === 'delete-pet'){
      var petD = findPet(t.getAttribute('data-pet-id'));
      if(petD) { state.sheet = {type:'confirm-delete', kind:'pet', pet:petD}; render(); }
      return;
    }
    if(action === 'add-contact'){ state.sheet = {type:'contact', contact:null}; render(); return; }
    if(action === 'edit-contact'){
      var ctE = findContact(t.getAttribute('data-contact-id'));
      if(ctE) { state.sheet = {type:'contact', contact:ctE}; render(); }
      return;
    }
    if(action === 'delete-contact'){
      var ctD = findContact(t.getAttribute('data-contact-id'));
      if(ctD) { state.sheet = {type:'confirm-delete', kind:'contact', contact:ctD}; render(); }
      return;
    }
    if(action === 'add-business'){ state.sheet = {type:'business', business:null}; render(); return; }
    if(action === 'edit-business'){
      var bzE = findBusiness(t.getAttribute('data-business-id'));
      if(bzE) { state.sheet = {type:'business', business:bzE}; render(); }
      return;
    }
    if(action === 'delete-business'){
      var bzD = findBusiness(t.getAttribute('data-business-id'));
      if(bzD) { state.sheet = {type:'confirm-delete', kind:'business', business:bzD}; render(); }
      return;
    }
    if(action === 'add-adoption'){ state.sheet = {type:'adoption', adoption:null, existingPhotos:[], newPhotos:[]}; render(); return; }
    if(action === 'open-donate'){ state.sheet = {type:'donate', method: defaultDonationMethod(), amount:'', currency:'ARS', settingsMode:false}; render(); return; }
    if(action === 'edit-adoption'){
      var adE = findAdoption(t.getAttribute('data-adoption-id'));
      if(adE) {
        var initAdPhotos = [];
        if(adE.photoUrls && adE.photoUrls.length){
          initAdPhotos = adE.photoUrls.map(function(url, i){ return {assetId: (adE.photoAssetIds||[])[i]||null, url:url}; });
        } else if(adE.photoUrl){
          initAdPhotos = [{assetId: adE.photoAssetId||null, url: adE.photoUrl}];
        }
        state.sheet = {type:'adoption', adoption:adE, existingPhotos:initAdPhotos, newPhotos:[]};
        render();
      }
      return;
    }
    if(action === 'delete-adoption'){
      var adD = findAdoption(t.getAttribute('data-adoption-id'));
      if(adD) { state.sheet = {type:'confirm-delete', kind:'adoption', adoption:adD}; render(); }
      return;
    }
    if(action === 'filter-category'){
      state.contactFilter = t.getAttribute('data-cat');
      render();
      return;
    }
    if(action === 'donate-method'){
      if(state.sheet){
        var dnAmountEl = document.getElementById('dn-amount'), dnCurrencyEl = document.getElementById('dn-currency');
        if(dnAmountEl) state.sheet.amount = dnAmountEl.value;
        if(dnCurrencyEl) state.sheet.currency = dnCurrencyEl.value;
        state.sheet.method = t.getAttribute('data-method');
      }
      render();
      return;
    }
    if(action === 'donate-settings'){
      if(!canEditDonation(state.db ? state.donationConfig : EXAMPLE_DONATION_CONFIG)){
        showToast('Solo la persona administradora de Huellas puede editar estos alias.');
        return;
      }
      if(state.sheet){
        var dsAmountEl = document.getElementById('dn-amount'), dsCurrencyEl = document.getElementById('dn-currency');
        if(dsAmountEl) state.sheet.amount = dsAmountEl.value;
        if(dsCurrencyEl) state.sheet.currency = dsCurrencyEl.value;
        state.sheet.settingsMode = true;
      }
      render();
      return;
    }
    if(action === 'donate-back'){
      if(state.sheet) state.sheet.settingsMode = false;
      render();
      return;
    }
    if(action === 'copy-donation-alias'){
      var aliasVal = t.getAttribute('data-alias') || '';
      if(aliasVal && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(aliasVal).then(function(){ showToast('Alias copiado.'); })['catch'](function(){ showToast('No pudimos copiar. Copialo manualmente: ' + aliasVal); });
      } else {
        showToast('Copialo manualmente: ' + aliasVal);
      }
      return;
    }
    if(action === 'confirm-delete'){
      if(state.sheet && state.sheet.kind==='contact') deleteContact(state.sheet.contact);
      else if(state.sheet && state.sheet.kind==='business') deleteBusiness(state.sheet.business);
      else if(state.sheet && state.sheet.kind==='adoption') deleteAdoption(state.sheet.adoption);
      else deletePet(state.sheet.pet);
      return;
    }
    if(action === 'mark-safe'){
      var petS = findPet(t.getAttribute('data-pet-id'));
      if(petS && petS.status !== 'segura') setPetStatus(petS, 'segura', null);
      return;
    }
    if(action === 'mark-lost'){
      var petL = findPet(t.getAttribute('data-pet-id'));
      if(petL && petL.status !== 'perdida') { state.sheet = {type:'mark-lost', pet:petL, loc:null, manual:false}; render(); }
      return;
    }
    if(action === 'confirm-lost'){
      if(state.sheet && state.sheet.loc) setPetStatus(state.sheet.pet, 'perdida', state.sheet.loc);
      closeSheet();
      return;
    }
    if(action === 'toggle-manual'){
      state.sheet.manual = !state.sheet.manual; render(); return;
    }
    if(action === 'get-location'){
      var btnLabel = t.textContent;
      t.disabled = true; t.innerHTML = '<span class="spinner"></span> Ubicando…';
      getLocation().then(function(loc){
        if(state.sheet) state.sheet.loc = loc;
        render();
      })['catch'](function(){
        showToast('No pudimos obtener tu ubicación automáticamente. Probá con la opción manual.');
        if(state.sheet) state.sheet.manual = true;
        render();
      });
      return;
    }
    if(action === 'save-manual-location'){
      var latEl = document.getElementById('man-lat'), lngEl = document.getElementById('man-lng');
      var lat = parseFloat(latEl.value), lng = parseFloat(lngEl.value);
      if(isNaN(lat) || isNaN(lng)){ showToast('Ingresá latitud y longitud válidas.'); return; }
      if(state.sheet) state.sheet.loc = {lat:lat, lng:lng};
      render();
      return;
    }
    if(action === 'pick-photo'){
      var targetId = t.getAttribute('data-photo-target') || 'pet-photo-input';
      var input = document.getElementById(targetId);
      if(input) input.click();
      return;
    }
    if(action === 'remove-existing-photo'){
      var idxE = parseInt(t.getAttribute('data-index'),10);
      if(state.sheet && state.sheet.existingPhotos) state.sheet.existingPhotos.splice(idxE,1);
      updatePhotoGrid();
      return;
    }
    if(action === 'remove-new-photo'){
      var idxN = parseInt(t.getAttribute('data-index'),10);
      if(state.sheet && state.sheet.newPhotos) state.sheet.newPhotos.splice(idxN,1);
      updatePhotoGrid();
      return;
    }
    if(t.id === 'backdrop' && e.target.id === 'backdrop'){ closeSheet(); return; }
  });

  document.addEventListener('submit', function(e){
    if(e.target.id === 'auth-form'){
      e.preventDefault();
      var isRegister = state.authView === 'register';
      var email = document.getElementById('au-email').value.trim();
      var password = document.getElementById('au-password').value;
      var nameEl = document.getElementById('au-name');
      var name = nameEl ? nameEl.value.trim() : '';
      if(!email || !password || (isRegister && !name)){
        state.authError = 'Completá todos los campos.'; render(); return;
      }
      var btn = document.getElementById('auth-submit-btn');
      if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + (isRegister ? 'Creando cuenta…' : 'Entrando…'); }
      var path = isRegister ? '/api/auth/register' : '/api/auth/login';
      var payload = isRegister ? {email:email, password:password, name:name} : {email:email, password:password};
      fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)}).then(function(res){
        return res.json().then(function(body){
          if(!res.ok) throw new Error(body.error || 'No se pudo completar la acción.');
          return body;
        });
      }).then(function(body){
        afterLogin(body.user, body.token);
      })['catch'](function(err){
        state.authError = err.message || 'No se pudo completar la acción.';
        render();
      });
      return;
    }
    if(e.target.id === 'report-form'){
      e.preventDefault();
      var s = state.sheet;
      if(!s.loc){ showToast('Primero indicá dónde la viste.'); return; }
      var note = document.getElementById('rep-note').value.trim();
      var name = document.getElementById('rep-name').value.trim();
      var phone = document.getElementById('rep-phone').value.trim();
      submitSighting(s.pet, s.loc, note, name, phone);
      return;
    }
    if(e.target.id === 'pet-form'){
      e.preventDefault();
      var s2 = state.sheet;
      var form = {
        name: document.getElementById('pf-name').value.trim(),
        species: document.getElementById('pf-species').value,
        size: document.getElementById('pf-size').value,
        breed: document.getElementById('pf-breed').value.trim(),
        color: document.getElementById('pf-color').value.trim(),
        description: document.getElementById('pf-desc').value.trim(),
        contactName: document.getElementById('pf-cname').value.trim(),
        contactPhone: document.getElementById('pf-cphone').value.trim(),
        contactNote: document.getElementById('pf-cnote').value.trim(),
        existingPhotos: s2.existingPhotos || [],
        newPhotoFiles: (s2.newPhotos || []).map(function(np){ return np.file; }),
        lostIntent: !!s2.lostIntent,
        loc: s2.loc || null
      };
      var errBox = document.getElementById('pet-form-error');
      if(!form.name){
        if(errBox){ errBox.textContent = 'Che, falta el nombre de tu mascota.'; errBox.style.display='block'; }
        return;
      }
      if(errBox) errBox.style.display='none';
      console.log('Huellas: guardando ficha…', form.name, 'db disponible:', !!state.db);
      savePet(form, s2.pet);
      return;
    }
    if(e.target.id === 'contact-form'){
      e.preventDefault();
      var s3 = state.sheet;
      var cform = {
        category: document.getElementById('cf-category').value,
        name: document.getElementById('cf-name').value.trim(),
        phone: document.getElementById('cf-phone').value.trim(),
        address: document.getElementById('cf-address').value.trim(),
        notes: document.getElementById('cf-notes').value.trim()
      };
      var cErrBox = document.getElementById('contact-form-error');
      if(!cform.name){
        if(cErrBox){ cErrBox.textContent = 'Falta el nombre del contacto.'; cErrBox.style.display='block'; }
        return;
      }
      if(cErrBox) cErrBox.style.display='none';
      saveContact(cform, s3.contact);
      return;
    }
    if(e.target.id === 'business-form'){
      e.preventDefault();
      var s4 = state.sheet;
      var bform = {
        category: document.getElementById('bf-category').value,
        name: document.getElementById('bf-name').value.trim(),
        responsibleName: document.getElementById('bf-responsible').value.trim(),
        email: document.getElementById('bf-email').value.trim(),
        phone: document.getElementById('bf-phone').value.trim(),
        description: document.getElementById('bf-desc').value.trim(),
        photoFile: s4.pendingPhotoFile || null
      };
      var bErrBox = document.getElementById('business-form-error');
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(bform.email);
      if(!bform.name || !bform.responsibleName || !emailOk){
        if(bErrBox){
          bErrBox.textContent = !bform.name ? 'Falta el nombre del establecimiento.' : !bform.responsibleName ? 'Falta el nombre del responsable.' : 'Ingresá un email válido.';
          bErrBox.style.display='block';
        }
        return;
      }
      if(bErrBox) bErrBox.style.display='none';
      saveBusiness(bform, s4.business);
      return;
    }
    if(e.target.id === 'adoption-form'){
      e.preventDefault();
      var s5 = state.sheet;
      var aform = {
        name: document.getElementById('af-name').value.trim(),
        species: document.getElementById('af-species').value,
        age: document.getElementById('af-age').value.trim(),
        breed: document.getElementById('af-breed').value.trim(),
        description: document.getElementById('af-desc').value.trim(),
        neutered: document.getElementById('af-neutered').checked,
        vaccinated: document.getElementById('af-vaccinated').checked,
        dewormed: document.getElementById('af-dewormed').checked,
        contactName: document.getElementById('af-cname').value.trim(),
        contactPhone: document.getElementById('af-cphone').value.trim(),
        existingPhotos: s5.existingPhotos || [],
        newPhotoFiles: (s5.newPhotos || []).map(function(np){ return np.file; })
      };
      var aErrBox = document.getElementById('adoption-form-error');
      if(!aform.description){
        if(aErrBox){ aErrBox.textContent = 'Contanos algo sobre la mascota en "Características".'; aErrBox.style.display='block'; }
        return;
      }
      if(aErrBox) aErrBox.style.display='none';
      saveAdoption(aform, s5.adoption);
      return;
    }
    if(e.target.id === 'donation-settings-form'){
      e.preventDefault();
      var dform = {
        mpAlias: document.getElementById('ds-mp').value.trim(),
        paypalAlias: document.getElementById('ds-pp').value.trim()
      };
      saveDonationConfig(dform);
      return;
    }
  });

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    state.installPromptEvent = e;
    render();
  });
  window.addEventListener('appinstalled', function(){
    state.installPromptEvent = null;
    state.installDismissed = true;
    dismissInstallBanner();
    render();
  });

  /* ============ BOOT ============ */
  render();
  tryResumeSession();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* no-op: la app sigue funcionando igual */ });
    });
  }
</script>
</body>
</html>
